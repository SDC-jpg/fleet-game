# Posts every push (any branch) to the Discord push-log channel: the player-facing
# lines added to CHANGELOG.md in this push, then the commits with links.
# Needs the DISCORD_WEBHOOK_PUSH secret; if it's missing, this quietly does nothing.
name: Push log to Discord

on: push

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to see what this push changed
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_PUSH }}
          COMMITS: ${{ toJSON(github.event.commits) }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          PUSHER: ${{ github.event.pusher.name }}
          COMPARE: ${{ github.event.compare }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_WEBHOOK_PUSH not set: skipping."; exit 0; fi
          count=$(printf '%s' "$COMMITS" | jq 'length')
          [ "$count" -gt 0 ] || { echo "No new commits: skipping."; exit 0; }

          # Player-facing changes: "- " lines added to CHANGELOG.md by this push.
          notes=""
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            notes=$(git diff "$BEFORE" "$SHA" -- CHANGELOG.md | grep -E '^\+- ' | sed 's/^+//' || true)
          fi
          [ -n "$notes" ] || notes="_No gameplay changes in this push._"

          # Commit list in small text: [abc1234](link) first line of the message
          commits=$(printf '%s' "$COMMITS" | jq -r '.[] | "-# [`\(.id[0:7])`](\(.url)) \(.message | split("\n")[0])"')

          plural=$([ "$count" -eq 1 ] && echo commit || echo commits)
          description="${notes}

          -# **Commits**
          ${commits}"
          description=$(printf '%s' "$description" | sed 's/^          //')
          payload=$(jq -n --arg t "📦 $count $plural pushed to $BRANCH by $PUSHER" --arg u "$COMPARE" \
            --arg d "${description:0:4000}" \
            '{username: "Fleet Game pushes", embeds: [{title: $t, url: $u, description: $d, color: 5793266}]}')
          echo "Sending:"; echo "$payload" | jq .
          curl -fsS -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK" \
            || echo "::warning::Could not post to Discord"
