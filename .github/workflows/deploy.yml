# Builds the game and publishes it to GitHub Pages every time code is pushed to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows a manual run from the Actions tab

permissions:
  contents: read
  actions: read # lets the Discord step find the previous published version
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Test keys on in the online version (set to "false" to turn them off).
          VITE_TEST_KEYS: 'true'
          # The version number (same as in the Discord post). Saved equipment only loads in the version that saved it.
          VITE_BUILD: ${{ github.run_number }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Posts the result and the new CHANGELOG.md lines to the Discord build-log channel.
  notify:
    needs: [build, deploy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to compare with the previous version
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_BUILD }}
          RESULT: ${{ needs.deploy.result == 'success' && 'success' || 'failure' }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SITE_URL: https://sdc-jpg.github.io/fleet-game/
          GH_TOKEN: ${{ github.token }}
        run: |
          # The last version that was published successfully (this run isn't finished yet).
          export PREV_SHA=$(gh run list --workflow deploy.yml --branch main --status success \
            --limit 1 --json headSha --jq '.[0].headSha' || true)
          .github/scripts/discord-build-log.sh
